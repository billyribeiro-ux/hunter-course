# Supabase local config — aligned with CLI 1.243 (April 2026).
# Run `supabase start` from the `app/` directory.

project_id = "contactly"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback"]
jwt_expiry = 3600
enable_signup = true
enable_confirmations = false    # OFF for local dev; ON in production.
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false                  # we don't need storage in this app
