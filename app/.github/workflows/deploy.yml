name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel env vars (Preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 1.243.0

      - name: Start local Supabase
        run: supabase start

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm test
        env:
          PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase-keys.outputs.anon_key || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.fake' }}
          PRIVATE_SUPABASE_SERVICE_ROLE: ${{ steps.supabase-keys.outputs.service_role || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.fake' }}
          PRIVATE_STRIPE_SECRET_KEY: sk_test_dummy
          PRIVATE_STRIPE_WEBHOOK_SECRET: whsec_dummy
          PUBLIC_BASE_URL: http://localhost:5173

      - name: Link Supabase CLI to production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push Supabase DB changes
        run: supabase db push

      - name: Pull Vercel env vars (Production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
